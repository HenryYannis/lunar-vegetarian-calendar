name: Update Calendar Feeds

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 装上固定版本的 tyme4py，自检才会真正校验农历日期，否则这一步会被跳过
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generation script
        run: python scripts/generate_feeds.py

      # 自检不通过就让 job 失败，不提交坏文件
      - name: Self-check feeds
        run: python scripts/check_feeds.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 每次都写入运行时间，保证每月至少有一次提交。
          # 公开仓库 60 天没有活动，GitHub 会自动停用 schedule。
          date -u +'%Y-%m-%dT%H:%M:%SZ' > last-updated.txt

          # Stage the modified root ICS files
          git add chuyi-shiwu-simplified.ics chuyi-shiwu-traditional.ics last-updated.txt
          
          # Check if there are any changes staged for commit
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update calendar feeds for $(date +'%Y-%m')"
            git push
            echo "Feeds updated and pushed successfully."
          else
            echo "No changes in calendar feeds."
          fi
