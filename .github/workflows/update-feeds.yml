name: Update Calendar Feeds

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run generation script
        run: python scripts/generate_feeds.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the modified root ICS files
          git add chuyi-shiwu-simplified.ics chuyi-shiwu-traditional.ics
          
          # Check if there are any changes staged for commit
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update calendar feeds for $(date +'%Y-%m')"
            git push
            echo "Feeds updated and pushed successfully."
          else
            echo "No changes in calendar feeds."
          fi
