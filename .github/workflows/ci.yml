name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 只读即可：CI 只生成和自检，不提交任何东西
permissions:
  contents: read

# 同一分支 / PR 有新提交时，取消还在跑的旧检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install icalendar==7.3.0 ruff==0.17.3

      # 只拦语法错误和未定义名称，不管代码风格
      - name: Lint and compile check
        run: |
          ruff check --select E9,F63,F7,F82 --output-format=github scripts tests
          python -m compileall -q scripts tests

      # 解析仓库里已提交的 .ics，并核对主库日期
      - name: Validate committed .ics files
        run: python tests/validate_ics.py

      - name: Generate rolling feeds
        run: python scripts/generate_feeds.py

      - name: Self-check feeds
        run: python scripts/check_feeds.py

      - name: Validate generated feeds
        run: python tests/validate_ics.py
